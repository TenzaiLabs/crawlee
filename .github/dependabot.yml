version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - testsites/**
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    exclude-paths:
      - testsites/**
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    exclude-paths:
      - testsites/**
    # Dependabot's uv updater currently ignores exclude-paths for nested
    # manifests (dependabot/dependabot-core#15102). These packages are used
    # only by testsites, so ignore them until that upstream bug is fixed.
    ignore:
      - dependency-name: flask
      - dependency-name: pillow
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
